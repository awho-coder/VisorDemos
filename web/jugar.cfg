// jugar.cfg -- teclas por defecto del cliente web de D-Day (pagina Jugar).
// La pagina lo instala en lugar de visor.cfg, asi no quedan las teclas del visor.
// Cada jugador puede cambiarlas en la consola (tecla ` o ~) con bind.

unbindall

bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"

// movimiento
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"
bind CTRL "+movedown"
bind SHIFT "+speed"
bind ALT "+strafe"
bind \ "stance"
bind c "stance"

// disparo y armas
bind MOUSE1 "+attack"
bind MOUSE2 "attack2"
bind r "reload"
bind 1 "use melee"
bind 2 "use weapon2"
bind 3 "use weapon1"
bind 4 "use grenades"
bind 5 "use special"
bind 6 "use pickup"
bind 0 "use pickup"
bind MWHEELUP "weapnext"
bind MWHEELDOWN "weapprev"
bind q "weapprev"
bind e "weapnext"
bind ' "invdrop"
bind g "drop ammo"

// menus y pantalla
bind TAB "scoreboard"
bind m "dday_menu_class"
bind o "objectives"
bind ENTER "invuse"
bind [ "invprev"
bind ] "invnext"
bind / "id"
bind - "sizedown"
bind = "sizeup"
bind PAUSE "pause"

// chat
bind t "messagemode"
bind y "messagemode2"
bind F8 "say_team Medic!!; shout medic; wave 3; medic"
