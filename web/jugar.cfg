// jugar.cfg -- teclas por defecto del cliente web de D-Day (pagina Jugar).
// Son las del archivo de binds oficial de D-Day:Normandy (autoexec.cfg del mod),
// mas el movimiento de siempre. La pagina lo instala en lugar de visor.cfg.
// Cada jugador puede cambiarlas en la consola (tecla ` o ~) con bind; se guardan.

unbindall

bind ESCAPE "togglemenu"
bind ` "toggleconsole"
bind ~ "toggleconsole"

// --- movimiento ---
bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"
bind SPACE "+moveup"      // saltar
bind CTRL "+movedown"     // agacharse
bind SHIFT "+speed"       // caminar (con cl_run 1 se corre siempre)
bind ALT "+strafe"
bind c "stance"           // de pie / tendido / arrastrarse

// --- general ---
bind MOUSE1 "+attack"
bind MOUSE2 "use weapon"  // TrueSight: apuntar por la mira; miras y binoculares hacen zoom
bind r "reload"
bind , "binds"            // lista de teclas del mod
bind q "autopickup"       // recoger armas del suelo automaticamente (si / no)

// --- armas ---
bind 1 "use melee"        // cuchillo y punos
bind 2 "use weapon2"      // arma secundaria
bind 3 "use weapon1"      // arma principal
bind 4 "use grenades"     // granadas
bind 5 "use special"      // binoculares (oficial), morfina (medico)
bind 6 "use pickup"       // arma recogida del suelo
bind 7 "use pickup"
bind 8 "use pickup"
bind 9 "use pickup"
bind 0 "use pickup"
bind g "use grenades"
bind e "weapnext"
bind MWHEELUP "weapnext"
bind MWHEELDOWN "weapprev"
bind BACKSPACE "drop weapon"  // bota el arma y su municion
bind x "drop gun"             // bota solo el arma
bind z "drop ammo"            // bota solo la municion
bind v "arty"                 // artilleria con binoculares (solo oficial)

// --- menus y pantalla ---
bind b "dday_menu_main"
bind n "dday_menu_team"
bind m "dday_menu_class"
bind TAB "scoreboard"
bind / "id"               // nombres de tu equipo
bind ENTER "invuse"
bind [ "invprev"
bind ] "invnext"
bind - "sizedown"
bind = "sizeup"

// --- chat ---
bind t "messagemode"      // a todos
bind y "messagemode2"     // al equipo

// --- gritos ---
bind F1 "v1"
alias v1 "shout thanks1; wave 1; bind F1 v2"
alias v2 "shout thanks2; wave 1; bind F1 v1"
bind F2 "a1"
alias a1 "shout yes1; wave 1; bind F2 a2"
alias a2 "shout yes2; wave 1; bind F2 a1"
bind F3 "b1"
alias b1 "shout no1; wave 0; bind F3 b2"
alias b2 "shout no2; wave 0; bind F3 b1"
bind F4 "c1"
alias c1 "shout cover1; wave 0; bind F4 c2"
alias c2 "shout cover2; wave 0; bind F4 c3"
alias c3 "shout cover3; wave 0; bind F4 c1"
bind F5 "z1"
alias z1 "shout move1; wave 4; bind F5 z2"
alias z2 "shout move2; wave 4; bind F5 z1"
bind F6 "e1"
alias e1 "shout left1; wave 4; bind F6 e2"
alias e2 "shout left2; wave 4; bind F6 e1"
bind F7 "f1"
alias f1 "shout right1; wave 4; bind F7 f2"
alias f2 "shout right2; wave 4; bind F7 f1"
bind F8 "say_team Medic!!; shout medic; wave 3; medic"
bind F9 "g1"
alias g1 "say_team Attack!!; shout attack1; wave 4; bind F9 g2"
alias g2 "say_team Attack!!; shout attack2; wave 4; bind F9 g1"
bind F10 "i1"
alias i1 "say_team Get on my shoulders!; shout shoulders1; bind F10 i2"
alias i2 "say_team Get on my shoulders!; shout shoulders2; bind F10 i1"
bind F11 "h1"
alias h1 "say_team Retreat!!; shout retreat1; wave 3; bind F11 h2"
alias h2 "say_team Retreat!!; shout retreat2; wave 3; bind F11 h1"
bind F12 "j1"
alias j1 "say_team Incoming!!!; shout incoming1; bind F12 j2"
alias j2 "say_team Incoming!!!; shout incoming2; bind F12 j1"
bind p "k1"
alias k1 "shout follow1; wave 3; bind p k2"
alias k2 "shout follow2; wave 3; bind p k1"
bind o "w1"
alias w1 "shout funny1; wave 2; bind o w2"
alias w2 "shout funny2; wave 2; bind o w3"
alias w3 "shout funny3; wave 2; bind o w1"
bind i "l1"
alias l1 "say_team Sniper!!!; shout sniper1; wave 4; bind i l2"
alias l2 "say_team Sniper!!!; shout sniper2; wave 4; bind i l1"
bind u "q1"
alias q1 "say_team Squad, Cease Fire!!; shout cease1; bind u q2"
alias q2 "say_team Squad, Cease Fire!!; shout cease2; bind u q1"
bind h "shout grenade1; wave 4"
bind j "shout help1; wave 3"
bind l "x1"
alias x1 "shout eye1; bind l x2"
alias x2 "shout smoke1; bind l x1"

// --- ajustes del archivo oficial ---
set cl_run "1"            // correr siempre
set freelook "1"
set cl_maxpackets "100"   // paquetes por segundo al servidor
