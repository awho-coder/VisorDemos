// visor.cfg -- teclas y ajustes de VisorDemos.
// visor.sh lo copia a la carpeta del visor y lo ejecuta en cada inicio,
// despues de config.cfg y autoexec.cfg. No afecta a otros clientes de Quake 2.
// Presiona H dentro de un demo para ver la ayuda.

// --- Reproduccion ---
bind DOWNARROW  "pause"
bind LEFTARROW  "seek -10"
bind RIGHTARROW "seek +10"
bind z          "demo_speed down"  // mas lento (letras: funcionan en cualquier teclado)
bind x          "demo_speed up"    // mas rapido
bind [          "demo_speed down"  // tambien [ ] y Av Pag / Re Pag
bind ]          "demo_speed up"
bind PGDN       "demo_speed down"
bind PGUP       "demo_speed up"
bind BACKSPACE  "demo_speed reset"
bind n          "frag_next"        // saltar al siguiente frag o muerte del jugador que ves
bind b          "frag_prev"        // saltar al frag o muerte anterior

// --- Camara ---
bind UPARROW    "freecam"          // camara libre si / no
bind e          "chase_next"       // seguir al siguiente jugador
bind q          "chase_prev"       // seguir al jugador anterior
bind r          "camera_reset"     // volver a la vista de quien grabo
bind c          "campath_record"   // grabar recorrido de camara / terminar
bind v          "campath_play"     // usar el recorrido grabado si / no
bind w          "+forward"
bind s          "+back"
bind a          "+moveleft"
bind d          "+moveright"
bind SPACE      "+moveup"
bind CTRL       "+movedown"
bind SHIFT      "+speed"
bind MWHEELUP   "camera_speed up"  // camara libre mas rapida (siguiendo: alejar)
bind MWHEELDOWN "camera_speed down" // camara libre mas lenta (siguiendo: acercar)
bind KP_PLUS    "camera_speed up"
bind KP_MINUS   "camera_speed down"

// --- Clips de video ---
bind i          "clip_in"          // marcar inicio
bind o          "clip_out"         // marcar fin
bind g          "clip_export"      // grabar el clip a video
bind DEL        "clip_clear"       // borrar marcas

// --- X-ray (version local, no publicada) ---
bind t          "visor_xray"       // siluetas de jugadores detras de paredes si / no
// xray_color        "team"   team = color por equipo, o uno fijo para todos:
//                            red, green, blue, yellow, magenta, cyan, white
// xray_color_allies "blue"   color de los Aliados con xray_color team
// xray_color_axis   "red"    color del Eje con xray_color team
// xray_alpha        "0.45"   opacidad de la silueta, 0.1 a 1
// visor_players              lista los jugadores y su equipo (consola)

// --- Otros ---
bind h          "visor_help"
set scr_showpause "0"              // la barra inferior ya muestra PAUSA

// --- Ajustes de la camara (se cambian en la consola y quedan guardados) ---
// freecam_speed  "300"   velocidad de la camara libre (tambien con la rueda del mouse)
// freecam_fast   "3"     multiplicador al mantener Shift
// freecam_smooth "0.15"  suavizado del movimiento (segundos)
// freecam_hud    "0"     1 = mostrar el HUD de quien grabo con la camara movida
// freecam_fov    "90"    campo de vision de la camara separada (ignora el zoom del rifle)
// chase_dist     "110"   distancia al jugador seguido (tambien con la rueda del mouse)
// chase_height   "28"    altura sobre el jugador seguido
// chase_auto     "0.6"   la camara vuelve detras del jugador (0 = no)
// campath_smooth "0.25"  suavizado del recorrido grabado (segundos)

// --- Ajustes de los clips (ver LEEME) ---
// clip_size    "1920x1080"   resolucion del video
// clip_fps     "60"          cuadros por segundo
// clip_format  "mp4"         mp4 = H.264+AAC  |  mov = ProRes+PCM (DaVinci Resolve)
// clip_quality "16"          calidad H.264 (menor = mejor, 14-20 recomendado)
// clip_hud     "0"           1 = incluir el HUD del juego en el video
// clip_volume  "0.7"         volumen del sonido en el video
// clip_name    "0"           1 = el nick del jugador que se ve sale en el video
// visor_name   "1"           nick del jugador que ves o sigues, arriba en pantalla
// clip_killfeed "1"          quien mato a quien en el video (2 = solo el jugador que se ve)
// clip_chat     "0"          1 = el chat sale en el video (2 = tambien avisos del servidor)

// --- Muertes y chat en pantalla ---
// visor_killfeed "1"         quien mato a quien, arriba a la derecha (2 = solo el jugador que ves)
// visor_chat     "1"         chat abajo a la izquierda (2 = tambien avisos del servidor)
// visor_feed_size "1"        tamano de la letra del kill feed y el chat
// visor_killfeed_time "6"    segundos que queda cada muerte (visor_chat_time "10" para el chat)
// visor_killfeed_lines "5"   lineas a la vez (visor_chat_lines "6" para el chat)
