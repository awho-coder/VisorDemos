// visor.cfg -- configuracion propia de VisorDemos.
// visor.sh lo copia a la carpeta del visor y lo ejecuta en cada inicio,
// despues de config.cfg y autoexec.cfg. No afecta al q2pro del flatpak.

// Controles de demo
bind LEFTARROW  "seek -10"
bind RIGHTARROW "seek +10"
bind DOWNARROW  "pause"
bind UPARROW    "freecam"      // camara libre on/off

// Camara libre: velocidad (unidades/s), multiplicador con +speed, suavizado (s)
set freecam_speed  "300"
set freecam_fast   "3"
set freecam_smooth "0.15"
set freecam_hud    "0"         // 1 = mostrar el HUD del que grabo el demo
